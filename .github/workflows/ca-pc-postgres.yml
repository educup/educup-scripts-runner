name: ca-pc-postgres

on:
  workflow_dispatch:
  schedule:
    # Run every 1 hour
    - cron: "0 * * * *"

jobs:
  run-process:
    uses: ./.github/workflows/process-csv-postgres.yml
    with:
      csv_path: "data/CA PC 2025.csv"
      state: ca
      speciality: pc
      email_column: "Email 1"
      npn_column: "Producer ID - NPN"
      lastname_column: "L Name"
    secrets: inherit
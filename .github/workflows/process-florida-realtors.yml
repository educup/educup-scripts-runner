name: process-florida-realtors

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of licenses to process (0 = all)"
        required: false
        default: "0"
        type: string
      license_column:
        description: "CSV column name containing the license number"
        required: false
        default: "LicenseNumber"
        type: string
  schedule:
    - cron: "0 * * * *"

jobs:
  process-florida-realtors:
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      LICENSE_COLUMN: ${{ github.event.inputs.license_column || 'LicenseNumber' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout processing scripts repository (educup/educup-scripts)
        uses: actions/checkout@v4
        with:
          repository: "educup/educup-scripts"
          fetch-depth: 1
          lfs: true
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install project dependencies
        run: uv sync --all-groups --all-extras

      - name: Setup Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: |
          google-chrome --version
          which google-chrome

      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply DB migration (florida_realtor_records)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Applying migration: database/migrations/002_add_florida_realtor_records.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_add_florida_realtor_records.sql

      - name: Process Florida Realtors CSV and push to PostgreSQL
        run: |
          LIMIT_FLAG=""
          if [ "${{ env.LIMIT }}" != "0" ] && [ -n "${{ env.LIMIT }}" ]; then
            LIMIT_FLAG="--limit ${{ env.LIMIT }}"
          fi

          echo "CSV: data/florida_realtor_licenses.csv"
          echo "License column: ${{ env.LICENSE_COLUMN }}"
          echo "Limit: ${{ env.LIMIT }}"

          uv run cli process-florida-realtors-csv-postgres "data/florida_realtor_licenses.csv" \
            --license-column "${{ env.LICENSE_COLUMN }}" \
            $LIMIT_FLAG

      - name: Minimize uv cache
        run: uv cache prune --ci

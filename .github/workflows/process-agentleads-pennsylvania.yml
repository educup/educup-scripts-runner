name: process-agentleads-pennsylvania

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of records to process'
        required: false
        default: '2000'
        type: string
  schedule:
    # Run every hour (7th largest backlog: 31,525 records)
    - cron: "0 * * * *"

jobs:
  run-process:
    uses: ./.github/workflows/process-agentleads.yml
    with:
      state: "Pennsylvania"
      limit: ${{ github.event.inputs.limit || '2000' }}
      batch_size: "100"
      verbose: true
    secrets: inherit

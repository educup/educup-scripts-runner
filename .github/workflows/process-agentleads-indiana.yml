name: process-agentleads-indiana

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of records to process'
        required: false
        default: '3000'
        type: string
  schedule:
    # Run every hour (6th largest backlog: 34,549 records)
    - cron: "0 * * * *"

jobs:
  run-process:
    uses: ./.github/workflows/process-agentleads.yml
    with:
      state: "IN"
      limit: ${{ github.event.inputs.limit || '3000' }}
      batch_size: "100"
      verbose: true
    secrets: inherit

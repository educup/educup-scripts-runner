name: update-agentleads-realtors

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of records to process (default 4500)"
        required: false
        default: "4500"
        type: string

jobs:
  update-realtors:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      LIMIT: ${{ github.event.inputs.limit || '4500' }}
    steps:
      - name: Checkout educup-scripts
        uses: actions/checkout@v4
        with:
          repository: "educup/educup-scripts"
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install project dependencies
        run: uv sync --all-groups --all-extras

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Update AgentLeads realtors
        run: |
          echo "Limit: ${{ env.LIMIT }}"
          uv run cli update-agentleads-realtors --limit ${{ env.LIMIT }} -v

      - name: Minimize uv cache
        run: uv cache prune --ci

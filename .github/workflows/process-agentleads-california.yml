name: process-agentleads-california

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of records to process'
        required: false
        default: '5000'
        type: string
  schedule:
    # Run every hour
    - cron: "0 * * * *"

jobs:
  run-process:
    uses: ./.github/workflows/process-agentleads.yml
    with:
      state: "California"
      limit: ${{ github.event.inputs.limit || '5000' }}
      batch_size: "150"
      verbose: true
    secrets: inherit

name: agentleads-daily-report

on:
  workflow_dispatch:
  schedule:
    # Run daily at 7 AM UTC
    - cron: "0 7 * * *"

jobs:
  generate-report:
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout processing scripts repository (educup/educup-scripts)
        uses: actions/checkout@v4
        with:
          repository: "educup/educup-scripts"
          fetch-depth: 1
          lfs: true
          # If the repository is private, provide a token with the secret `GH_PAT`.
          # For public repositories, it can be omitted.
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install project dependencies
        run: uv sync --all-groups --all-extras

      - name: Generate Statistics Report
        run: |
          echo "=================================================="
          echo "AGENTLEADS LICENSE PROCESSING DAILY REPORT"
          echo "Report Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=================================================="
          echo ""
          
          # Generate Markdown report and write to GitHub Step Summary
          uv run cli agentleads-report --markdown >> $GITHUB_STEP_SUMMARY
          
          # Also output plain text version to logs
          echo ""
          echo "Plain text version (for logs):"
          echo ""
          uv run cli agentleads-report
          
          echo ""
          echo "=================================================="
          echo "Report generation completed"
          echo "Check the 'Summary' tab above for formatted report"
          echo "=================================================="

      - name: Minimize uv cache
        run: uv cache prune --ci

name: agentleads-daily-report

on:
  workflow_dispatch:
  schedule:
    # Run daily at 7 AM UTC
    - cron: "0 7 * * *"

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout educup-scripts repository
        uses: actions/checkout@v4
        with:
          repository: educup/educup-scripts
          token: ${{ secrets.GH_PAT }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync
      
      - name: Generate Statistics Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=================================================="
          echo "AGENTLEADS LICENSE PROCESSING DAILY REPORT"
          echo "Report Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=================================================="
          echo ""
          
          # Generate Markdown report and write to GitHub Step Summary
          uv run cli agentleads-report --markdown >> $GITHUB_STEP_SUMMARY
          
          # Also output plain text version to logs
          echo ""
          echo "Plain text version (for logs):"
          echo ""
          uv run cli agentleads-report
          
          echo ""
          echo "=================================================="
          echo "Report generation completed"
          echo "Check the 'Summary' tab above for formatted report"
          echo "=================================================="

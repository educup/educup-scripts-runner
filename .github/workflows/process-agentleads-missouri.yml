name: process-agentleads-missouri

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of records to process'
        required: false
        default: '3000'
        type: string
  schedule:
    # Run every hour (5th largest backlog: 39,041 records)
    - cron: "0 * * * *"

jobs:
  run-process:
    uses: ./.github/workflows/process-agentleads.yml
    with:
      state: "MO"
      limit: ${{ github.event.inputs.limit || '3000' }}
      batch_size: "100"
      verbose: true
    secrets: inherit
